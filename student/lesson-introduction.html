<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathPath Lesson Introduction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="bg-shape bg-shape-top"></div>
  <div class="bg-shape bg-shape-bottom"></div>

  <main class="shell">
    <header class="top-header">
      <h1>MathPath Lesson: Introduction</h1>
      <p>Starter equations to build confidence.</p>
      <a href="index.html" class="secondary" style="display:inline-block;text-decoration:none;">Back to Lesson Path</a>
    </header>

    <section class="panel">
      <h2>Warm-Up</h2>
      <p class="math">x + 4 = 11</p>
      <p>Solve for x. If x + 4 = 11, then x = 7.</p>
      <div class="actions">
        <button class="secondary" id="generate-intro-context">Generate Context</button>
      </div>
      <p class="hint hidden" id="intro-context">Context: A notebook costs x shillings plus a 4-shilling cover fee, total cost is 11.</p>
      <div class="callout">You can now continue to Variables and Distribution lessons.</div>
    </section>
  </main>

  <script>
    const introContexts = [
      'Context: A notebook costs x shillings plus a 4-shilling cover fee, total cost is 11.',
      'Context: A bus ride costs x shillings and a fixed 4-shilling terminal fee, total 11.',
      'Context: A fruit pack has x oranges and 4 bonus oranges, making 11 in total.'
    ];
    let introIndex = 0;
    const introButton = document.getElementById('generate-intro-context');
    const introText = document.getElementById('intro-context');
    introButton.addEventListener('click', () => {
      if (introText.classList.contains('hidden')) {
        introText.classList.remove('hidden');
        introButton.textContent = '';
        introText.textContent = introContexts[introIndex];
        return;
      }
    });
  </script>
</body>
</html>
