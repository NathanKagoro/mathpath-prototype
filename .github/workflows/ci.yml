name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (engine, store, generated pages)
        run: npm test
      - name: Build the site exactly as Pages publishes it
        run: npm run site
      - name: Install a browser for the checks below
        run: npm install --no-save puppeteer
      - name: Browser checks
        run: node tools/e2e.cjs _site shots
      - name: Screenshots at 1440, 390 and 360 px
        run: node tools/screenshots.cjs _site shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
